spring:
  application:
    name: bo-api

  datasource:
    url: jdbc:mysql://localhost:3306/stylink?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
    open-in-view: false

server:
  port: 8090

logging:
  level:
    com.stylink: DEBUG
    org.hibernate.SQL: DEBUG
