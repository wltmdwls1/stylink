spring:
  application:
    name: fo-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stylink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

logging:
  level:
    com.stylink: DEBUG
    org.hibernate.SQL: DEBUG            # SQL 로그는 Logback 경유로만 출력 (show_sql 미사용)
    # org.hibernate.orm.jdbc.bind: TRACE  # 바인딩 파라미터 값까지 보고 싶을 때 주석 해제
